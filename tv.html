<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무룡고 급식 현황판 (TV 전용)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { box-sizing: border-box; }
        
        /* ✨ 마우스 커서 제어 스타일 */
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #f1f5f9; 
            margin: 0; padding: 40px; 
            height: 100vh; display: flex; flex-direction: column; 
            overflow: hidden; position: relative;
            cursor: default; /* 기본 커서 */
            transition: cursor 0.3s;
        }

        /* ✨ 마우스를 안 움직일 때 커서와 버튼을 모두 숨기는 클래스 */
        .hide-all {
            cursor: none !important; /* 마우스 커서 사라짐 */
        }
        .hide-all .controls {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* [기존 디자인 레이아웃 유지] */
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px 50px; border-radius: 25px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .school-name { font-size: 3rem; font-weight: 900; color: #0f172a; }
        .clock { font-size: 2.5rem; font-weight: 700; color: #3b82f6; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex-grow: 1; }
        .status-card { background: white; border-radius: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 8px solid #3b82f6; }
        .status-label { font-size: 4rem; color: #64748b; font-weight: 700; margin-bottom: 20px; }
        .current-grade { font-size: 15rem; font-weight: 900; color: #1d4ed8; line-height: 1; }
        .side-content { display: flex; flex-direction: column; gap: 30px; }
        .info-box { background: white; border-radius: 40px; padding: 40px; flex: 1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .info-title { font-size: 2.5rem; font-weight: 900; color: #0f172a; margin-bottom: 20px; border-bottom: 5px solid #3b82f6; display: inline-block; }
        .info-text { font-size: 2.4rem; line-height: 1.4; color: #334155; font-weight: 700; }

        /* 알림 팝업 */
        #alertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(239, 68, 68, 0.98); color: white; z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .alert-title { font-size: 6rem; font-weight: 900; margin-bottom: 20px; }
        .alert-msg { font-size: 11rem; font-weight: 900; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* 하단 컨트롤 바 */
        .controls { position: absolute; bottom: 30px; right: 30px; display: flex; gap: 15px; transition: opacity 0.5s; z-index: 100; opacity: 1; }
        .btn { padding: 15px 25px; border-radius: 15px; border: none; cursor: pointer; font-size: 1.2rem; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-fs { background: #1e293b; color: white; }
        .btn-test { background: #10b981; color: white; }
    </style>
</head>
<body onmousemove="resetTimer()">

<div id="alertOverlay">
    <div class="alert-title">지금 즉시 급식실 입장하세요!</div>
    <div id="alertGrade" class="alert-msg">O학년</div>
</div>

<header>
    <div class="school-name">무룡고등학교 실시간 급식실</div>
    <div class="clock" id="clock">00:00:00</div>
</header>

<div class="main-content">
    <div class="status-card"><div class="status-label">현재 배식 중</div><div class="current-grade" id="tvGrade">연결 중</div></div>
    <div class="side-content">
        <div class="info-box"><div class="info-title">📢 알림판</div><div id="tvNotice" class="info-text">데이터 로딩 중...</div></div>
        <div class="info-box"><div class="info-title">🍚 오늘의 식단</div><div id="tvMenu" class="info-text" style="color: #475569;">로딩 중...</div></div>
    </div>
</div>

<div class="controls" id="controls">
    <button class="btn btn-test" onclick="testSound()">🔊 소리 테스트</button>
    <button class="btn btn-fs" id="fsBtn" onclick="toggleFullScreen()">🖥️ 전체화면 시작</button>
</div>

<script>
    const SUPABASE_URL = 'https://aaszccrhporceolrnroz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LMeSKJzTDv8L-boma9QIFA_b8iJ89e9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const grades = ["3학년", "2학년", "1학년", "배식 종료"];
    
    const dingDong = new Audio('https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3');

    let timer;
    let currentIdx = -1;

    // ✨ 마우스와 버튼을 동시에 숨기는 타이머 함수
    function resetTimer() {
        document.body.classList.remove('hide-all'); // 마우스 움직이면 다시 나타남
        clearTimeout(timer);
        timer = setTimeout(() => {
            document.body.classList.add('hide-all'); // 3초간 안 움직이면 마우스 커서+버튼 숨김
        }, 3000);
    }

    function testSound() {
        dingDong.play().catch(e => console.log("잠금 해제 필요"));
        alert("소리가 들린다면 정상입니다!");
    }

    function toggleFullScreen() {
        dingDong.play().then(() => { dingDong.pause(); dingDong.currentTime = 0; });
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            document.getElementById('fsBtn').innerText = "❌ 해제";
        } else {
            document.exitFullscreen();
            document.getElementById('fsBtn').innerText = "🖥️ 전체화면 시작";
        }
    }

    function showAlert(grade) {
        if (grade === "배식 종료") return;
        document.getElementById('alertGrade').innerText = grade;
        document.getElementById('alertOverlay').style.display = 'flex';
        dingDong.play().catch(e => {});
        setTimeout(() => { document.getElementById('alertOverlay').style.display = 'none'; }, 60000);
    }

    function updateTVUI(idx) {
        const gradeBox = document.getElementById('tvGrade');
        if (currentIdx !== -1 && currentIdx !== idx) { showAlert(grades[idx]); }
        currentIdx = idx;
        gradeBox.innerText = grades[idx];
        gradeBox.style.color = (idx === 3) ? "#94a3b8" : "#1d4ed8";
    }

    async function getTVMenu() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        const dateStr = `${y}${m}${d}`;
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=H10&SD_SCHUL_CODE=7480070&MLSV_YMD=${dateStr}`;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            if (data.mealServiceDietInfo) {
                let menu = data.mealServiceDietInfo[1].row[0].DDISH_NM.replace(/[0-9.]/g, '').replace(/\(\)/g, '').replace(/<br\/>/g, ', ');
                document.getElementById('tvMenu').innerText = menu;
            } else {
                document.getElementById('tvMenu').innerText = "오늘은 급식 정보가 없습니다. 🏖️";
            }
        } catch (e) { document.getElementById('tvMenu').innerText = "식단 정보를 불러오지 못했습니다."; }
    }

    async function init() {
        const { data: s } = await supabaseClient.from('lunch_status').select('current_index').eq('id', 1).single();
        if(s) { currentIdx = s.current_index; updateTVUI(s.current_index); }
        const { data: n } = await supabaseClient.from('announcements').select('content').eq('id', 1).single();
        if(n) document.getElementById('tvNotice').innerText = n.content;
        getTVMenu();
    }

    supabaseClient.channel('tv').on('postgres_changes', { event: 'UPDATE', schema: 'public' }, p => {
        if (p.table === 'lunch_status') updateUI_Realtime(p.new.current_index);
        if (p.table === 'announcements') document.getElementById('tvNotice').innerText = p.new.content;
    }).subscribe();

    function updateUI_Realtime(idx) { updateTVUI(idx); }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('ko-KR'); }, 1000);
    init();
    resetTimer(); // 초기 타이머 시작
</script>
</body>
</html>
