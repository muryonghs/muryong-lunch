<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무룡고 급식 관리자</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        h1 { font-size: 1.4rem; color: #0f172a; text-align: center; margin-bottom: 25px; font-weight: 800; }
        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .label { font-size: 0.85rem; color: #64748b; font-weight: 700; margin-bottom: 10px; display: block; }
        .status-val { font-size: 1.8rem; font-weight: 900; color: #3b82f6; margin-bottom: 20px; text-align: center; }
        
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-next { background: #3b82f6; color: white; }
        .btn-reset { background: white; color: #94a3b8; border: 1px solid #e2e8f0; }
        .btn-save { background: #0f172a; color: white; margin-top: 10px; }
        .btn-clear { background: #fee2e2; color: #ef4444; font-size: 0.9rem; padding: 10px; margin-top: 10px; }
        
        textarea { width: 100%; height: 80px; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-family: inherit; resize: none; box-sizing: border-box; }
        .feedback-list { max-height: 200px; overflow-y: auto; background: #f1f5f9; padding: 10px; border-radius: 10px; }
        .fb-item { padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏫 무룡고등학교 급식 관리 센터</h1>

    <div class="card">
        <span class="label">배식 순서 제어</span>
        <div class="status-val" id="curGrade">데이터 연결 중...</div>
        <button class="btn-next" onclick="updateIdx('next')">다음 학년/상태 호출</button>
        <button class="btn-reset" onclick="updateIdx('reset')">순서 초기화 (배식 전으로)</button>

        <hr style="border:0; border-top:1px dashed #e2e8f0; margin: 20px 0;">
        <span class="label">예상 대기 시간 설정 (설정값: <span id="tempWaitDisplay" style="color:#e11d48; font-weight:900;">0</span>분)</span>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <button class="btn-reset" style="margin:0; color:#1e293b;" onclick="addWait(1)">+1분</button>
            <button class="btn-reset" style="margin:0; color:#1e293b;" onclick="addWait(5)">+5분</button>
            <button class="btn-reset" style="margin:0; color:#1e293b;" onclick="addWait(10)">+10분</button>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-reset" style="margin:0; flex: 1;" onclick="resetWait()">0분 초기화</button>
            <button class="btn-save" style="margin:0; flex: 1;" onclick="sendWaitTime()">전송하기</button>
        </div>
        <div style="font-size:0.75rem; color:#94a3b8; text-align:center; margin-top:8px;">
            ※ 0분으로 전송 시 학생/TV 화면에서 안내 문구가 완전히 숨겨집니다.
        </div>
    </div>

    <div class="card">
        <span class="label">실시간 공지사항 수정</span>
        <textarea id="noticeInput" placeholder="여기에 공지를 입력하세요."></textarea>
        <button class="btn-save" onclick="saveNotice()">공지사항 업데이트</button>
    </div>

    <div class="card">
        <span class="label">최근 건의사항</span>
        <div id="fbList" class="feedback-list">건의사항이 없습니다.</div>
        <button class="btn-clear" onclick="clearFeedback()">🗑️ 건의사항 전체 삭제 (보안)</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://aaszccrhporceolrnroz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LMeSKJzTDv8L-boma9QIFA_b8iJ89e9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const grades = ["배식 전", "3학년", "2학년", "1학년", "배식 종료"];
    let idx = 0;
    
    // ✨ 대기 시간 제어 변수
    let tempWaitTime = 0;

    async function init() {
        const { data: s } = await supabaseClient.from('lunch_status').select('current_index').eq('id', 1).single();
        if(s) { idx = s.current_index; updateColor(idx); }

        const { data: n } = await supabaseClient.from('announcements').select('content').eq('id', 1).single();
        if(n) document.getElementById('noticeInput').value = n.content;

        loadExistingFeedback();
    }

    function updateColor(currentIndex) {
        const gradeBox = document.getElementById('curGrade');
        gradeBox.innerText = grades[currentIndex];
        gradeBox.style.color = (currentIndex === 0 || currentIndex === 4) ? "#94a3b8" : "#3b82f6";
    }

    async function updateIdx(type) {
        if(type === 'next' && idx < 4) idx++; 
        else if(type === 'reset') {
            if(!confirm("순서를 초기화하시겠습니까?")) return;
            idx = 0;
        }

        const { error } = await supabaseClient.from('lunch_status').update({current_index: idx}).eq('id', 1);
        if(!error) updateColor(idx);
    }

    // ✨ 대기 시간 제어 함수
    function addWait(min) {
        tempWaitTime += min;
        document.getElementById('tempWaitDisplay').innerText = tempWaitTime;
    }

    function resetWait() {
        tempWaitTime = 0;
        document.getElementById('tempWaitDisplay').innerText = tempWaitTime;
    }

    async function sendWaitTime() {
        // 관리자가 설정한 시간과 그 시점(timestamp)을 동시에 DB에 전송
        const { error } = await supabaseClient.from('lunch_status')
            .update({
                wait_minutes: tempWaitTime,
                wait_set_at: new Date().toISOString()
            }).eq('id', 1);

        if(!error) {
            if(tempWaitTime === 0) alert("0분으로 설정되었습니다.\n(학생/TV 화면에서 예상 대기 시간이 숨겨집니다)");
            else alert(`${tempWaitTime}분 대기 시간이 학생들과 TV로 전송되었습니다!`);
        } else {
            alert("전송 실패: " + error.message);
        }
    }

    async function saveNotice() {
        const val = document.getElementById('noticeInput').value;
        const { error } = await supabaseClient.from('announcements').update({content: val}).eq('id', 1);
        if(!error) alert("공지가 반영되었습니다!");
    }

    async function clearFeedback() {
        const password = prompt("건의사항을 삭제하려면 비밀번호를 입력하세요.");
        
        if (password === null) return;
        
        if (password === "mrhslh") {
            if(!confirm("정말로 모든 건의사항을 영구 삭제하시겠습니까?")) return;
            
            const { error } = await supabaseClient.from('feedback').delete().neq('content', '');
            
            if(!error) {
                alert("건의사항이 모두 초기화되었습니다.");
                document.getElementById('fbList').innerHTML = "건의사항이 없습니다.";
            } else {
                alert("삭제 실패: " + error.message);
            }
        } else {
            alert("비밀번호가 틀렸습니다.");
        }
    }

    async function loadExistingFeedback() {
        const { data } = await supabaseClient.from('feedback').select('content').order('id', { ascending: false }).limit(20);
        if (data && data.length > 0) {
            const list = document.getElementById('fbList');
            list.innerText = "";
            data.forEach(item => {
                const div = document.createElement('div'); div.className = 'fb-item'; div.innerText = item.content;
                list.appendChild(div);
            });
        }
    }

    supabaseClient.channel('fb').on('postgres_changes', {event:'INSERT', schema:'public', table:'feedback'}, p => {
        const list = document.getElementById('fbList');
        if(list.innerText === "건의사항이 없습니다.") list.innerText = "";
        const div = document.createElement('div'); div.className='fb-item'; div.innerText = p.new.content;
        list.prepend(div);
    }).subscribe();

    init();
</script>
</body>
</html>
