<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무룡고등학교 실시간 급식실</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        /* 🌿 전체 배경 및 폰트 세팅 */
        body { font-family: 'Pretendard', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 20px 15px; display: flex; justify-content: center; }
        .container { max-width: 480px; width: 100%; position: relative; display: flex; flex-direction: column; gap: 16px; }
        
        /* 🌿 상단 헤더 */
        .app-header { text-align: center; margin-bottom: 5px; }
        .app-header h1 { font-size: 1.4rem; font-weight: 800; margin: 0; letter-spacing: -0.5px; color: #1e293b; }
        .app-header p { margin: 5px 0 0 0; font-size: 0.85rem; color: #64748b; font-weight: 500; }

        /* 🌿 부드러워진 알림 켜기 버튼 */
        .sound-btn {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; 
            padding: 16px; border-radius: 20px; font-size: 1.05rem; font-weight: 800; 
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.05);
        }
        .sound-btn:active { transform: scale(0.98); background: #d1fae5; }

        /* 🌿 긴급 호출 배너 */
        .notice-banner { display: none; background: #ef4444; color: white; padding: 18px; border-radius: 20px; text-align: center; font-size: 1.3rem; font-weight: 800; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25); animation: pulse 1.5s infinite; word-break: keep-all; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); background: #dc2626; } 100% { transform: scale(1); } }

        /* 🌿 공통 카드 스타일 (그림자 최소화, 라운드 강조) */
        .card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .card-title { font-size: 1.05rem; font-weight: 700; color: #334155; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        /* 🌿 메인 현황 카드 (가장 돋보이게) */
        .status-card { text-align: center; border: 2px solid #eff6ff; }
        .status-header { font-size: 0.9rem; color: #64748b; font-weight: 600; display: block; margin-bottom: 5px; }
        .queue-status { font-size: 2.8rem; font-weight: 900; color: #2563eb; letter-spacing: -1px; margin-bottom: 15px; }
        
        /* 대기 시간 박스 (현황 카드 안으로 통합) */
        .wait-box { display: none; background: #f8fafc; border-radius: 16px; padding: 16px; }
        .wait-time-text { font-size: 1.1rem; font-weight: 700; color: #475569; margin-bottom: 4px; }
        .wait-time-text span { color: #e11d48; font-size: 1.4rem; font-weight: 900; font-variant-numeric: tabular-nums; } 
        .wait-notice { font-size: 0.75rem; color: #94a3b8; font-weight: 500; word-break: keep-all; }

        /* 🌿 알림판 & 메뉴 스타일 정리 */
        .notice-card { background: #f0fdf4; border: none; }
        .notice-card .card-title { color: #166534; }
        .notice-content { font-size: 1.05rem; line-height: 1.5; color: #15803d; font-weight: 600; word-break: break-all; }
        .menu-content { text-align: center; line-height: 1.8; font-size: 1.1rem; color: #475569; font-weight: 500; }
        
        /* 🌿 건의사항 폼 깔끔하게 */
        .feedback-box { display: flex; flex-direction: column; gap: 12px; }
        textarea { width: 100%; height: 80px; padding: 16px; border-radius: 16px; border: 1px solid #e2e8f0; background: #f8fafc; font-family: inherit; resize: none; font-size: 1rem; box-sizing: border-box; transition: 0.2s; }
        textarea:focus { outline: none; border-color: #3b82f6; background: #fff; }
        button.submit-btn { background: #1e293b; color: white; padding: 16px; border: none; border-radius: 16px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button.submit-btn:active { transform: scale(0.98); background: #0f172a; }

        /* 🚨 전체화면 긴급 팝업 */
        #alertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(220, 38, 38, 0.96); color: white; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: fadeIn 0.3s; cursor: pointer; }
        .alert-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 15px; opacity: 0.9; }
        .alert-msg { font-size: 5rem; font-weight: 900; letter-spacing: -2px; animation: bounce 0.6s infinite alternate; }
        .alert-hint { margin-top: 40px; font-size: 1rem; opacity: 0.7; font-weight: 500; background: rgba(0,0,0,0.2); padding: 12px 24px; border-radius: 30px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); } }
    </style>
</head>
<body>

<div id="alertOverlay" onclick="closeAlert()">
    <div class="alert-title">지금 즉시 급식실로 내려오세요!</div>
    <div id="alertGrade" class="alert-msg">O학년</div>
    <div class="alert-hint">화면을 터치하면 닫힙니다</div>
</div>

<div class="container">
    
    <div class="app-header">
        <h1>🏫 무룡고 스마트 급식실</h1>
        <p>실시간 배식 현황을 확인하세요</p>
    </div>
    
    <button id="soundBtn" class="sound-btn" onclick="enableSound()">
        🔔 알림 켜기 (소리 및 팝업)
    </button>
    
    <div id="noticeBanner" class="notice-banner">
        <span id="targetGrade">O학년</span> 학생들은<br>지금 즉시 급식실로 내려오세요!
    </div>

    <div class="card status-card">
        <span class="status-header">현재 배식 중인 학년</span>
        <div class="queue-status" id="studentQueue">데이터 연결 중...</div>
        
        <div id="waitTimeBox" class="wait-box">
            <div class="wait-time-text">호출까지 약 <span id="displayTime">00:00</span></div>
            <div class="wait-notice">※ 안내된 시간은 실제 상황과 다를 수 있습니다.</div>
        </div>
    </div>

    <div class="card notice-card">
        <div class="card-title">📢 급식실 알림판</div>
        <div id="realNotice" class="notice-content">공지사항을 불러오고 있습니다...</div>
    </div>

    <div class="card">
        <div class="card-title">🍚 오늘의 식단</div>
        <div class="menu-content" id="menuContent">급식 메뉴를 불러오고 있습니다...</div>
    </div>

    <div class="card feedback-box">
        <div class="card-title">✍️ 급식실에 바란다</div>
        <textarea id="feedbackText" placeholder="급식 메뉴나 급식실 이용에 관한 의견을 남겨주세요!"></textarea>
        <button class="submit-btn" onclick="sendFeedback()">의견 보내기</button>
    </div>

</div>

<script>
    const SUPABASE_URL = 'https://aaszccrhporceolrnroz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LMeSKJzTDv8L-boma9QIFA_b8iJ89e9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const grades = ["배식 전", "3학년", "2학년", "1학년", "배식 종료"];
    let currentIdx = -1;
    let alertTimeout;
    let waitInterval = null;

    const dingDong = new Audio('https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3');

    function enableSound() {
        dingDong.play().then(() => {
            dingDong.pause(); 
            dingDong.currentTime = 0;
            document.getElementById('soundBtn').style.display = 'none';
            alert("알림이 켜졌습니다! 화면을 켜두시면 순서가 될 때 알려드립니다.");
        }).catch(e => {
            alert("소리 재생을 지원하지 않는 설정입니다.");
        });
    }

    function showAlert(grade) {
        if (grade === "배식 종료" || grade === "배식 전") return;
        document.getElementById('alertGrade').innerText = grade;
        document.getElementById('alertOverlay').style.display = 'flex';
        
        dingDong.play().catch(e => console.log("터치 전"));
        clearTimeout(alertTimeout);
        alertTimeout = setTimeout(closeAlert, 15000);
    }

    function closeAlert() { 
        document.getElementById('alertOverlay').style.display = 'none'; 
        dingDong.pause(); dingDong.currentTime = 0;
    }

    function updateWaitTimeUI(waitMin, setAtStr) {
        const waitBox = document.getElementById('waitTimeBox');
        if (waitInterval) clearInterval(waitInterval);

        if (!waitMin || waitMin <= 0 || !setAtStr) {
            waitBox.style.display = 'none';
            return;
        }

        const setAt = new Date(setAtStr);
        waitInterval = setInterval(() => {
            const now = new Date();
            const diffSec = Math.floor((now - setAt) / 1000);
            const remainingSec = (waitMin * 60) - diffSec;

            if (remainingSec <= 0) {
                waitBox.style.display = 'none';
                clearInterval(waitInterval);
            } else {
                waitBox.style.display = 'block';
                const m = Math.floor(remainingSec / 60);
                const s = remainingSec % 60;
                document.getElementById('displayTime').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
        }, 1000);
    }

    async function loadData() {
        const { data: statusData } = await supabaseClient.from('lunch_status').select('current_index, wait_minutes, wait_set_at').eq('id', 1).single();
        if (statusData) {
            currentIdx = statusData.current_index;
            updateUI(statusData.current_index);
            updateWaitTimeUI(statusData.wait_minutes, statusData.wait_set_at);
        }
        const { data: noticeData } = await supabaseClient.from('announcements').select('content').eq('id', 1).single();
        if (noticeData) document.getElementById('realNotice').innerText = noticeData.content;
    }

    function updateUI(index) {
        const statusBox = document.getElementById('studentQueue');
        const banner = document.getElementById('noticeBanner');
        const targetGrade = document.getElementById('targetGrade');
        
        if (currentIdx !== -1 && currentIdx !== index && index > 0 && index < 4) { showAlert(grades[index]); }
        currentIdx = index;
        
        if (index === 0 || index === 4) {
            statusBox.innerText = grades[index];
            statusBox.style.color = "#94a3b8";
            document.querySelector('.status-card').style.borderColor = "transparent";
            banner.style.display = "none";
        } else {
            const currentGrade = grades[index];
            statusBox.innerText = currentGrade;
            statusBox.style.color = "#2563eb";
            document.querySelector('.status-card').style.borderColor = "#eff6ff";
            banner.style.display = "block";
            targetGrade.innerText = currentGrade;
        }
    }

    supabaseClient.channel('custom-all-channel').on('postgres_changes', { event: 'UPDATE', schema: 'public' }, payload => {
        if (payload.table === 'lunch_status') {
            updateUI(payload.new.current_index);
            updateWaitTimeUI(payload.new.wait_minutes, payload.new.wait_set_at);
        }
        if (payload.table === 'announcements') document.getElementById('realNotice').innerText = payload.new.content;
    }).subscribe();

    async function sendFeedback() {
        const text = document.getElementById('feedbackText').value;
        if (!text.trim()) return;
        const { error } = await supabaseClient.from('feedback').insert([{ content: text }]);
        if (!error) { alert("소중한 의견이 전송되었습니다!"); document.getElementById('feedbackText').value = ""; }
    }

    async function fetchMenu() {
        const d = new Date().toISOString().slice(0,10).replace(/-/g, '');
        try {
            const res = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=H10&SD_SCHUL_CODE=7480070&MLSV_YMD=${d}`);
            const data = await res.json();
            if (data.mealServiceDietInfo) {
                let m = data.mealServiceDietInfo[1].row[0].DDISH_NM.replace(/[0-9.]/g, '').replace(/\(\)/g, '').replace(/<br\/>/g, '<br>');
                document.getElementById('menuContent').innerHTML = m;
            } else { document.getElementById('menuContent').innerText = "오늘은 급식 정보가 없습니다."; }
        } catch(e) { document.getElementById('menuContent').innerText = "식단 정보를 불러오지 못했습니다."; }
    }

    loadData(); fetchMenu();
</script>
</body>
</html>
