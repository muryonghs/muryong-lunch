<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무룡고등학교 실시간 급식실</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body { font-family: 'Pretendard', sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; position: relative; }
        
        .header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 1.3rem; color: #1e293b; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        .sound-btn { background: #e2e8f0; color: #475569; border: none; padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .sound-btn.active { background: #10b981; color: white; }

        #alertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(239, 68, 68, 0.95); color: white; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; animation: fadeIn 0.3s; cursor: pointer; }
        .alert-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 15px; }
        .alert-msg { font-size: 4.5rem; font-weight: 900; animation: bounce 0.6s infinite alternate; }
        .alert-hint { margin-top: 30px; font-size: 1rem; opacity: 0.8; font-weight: 500; background: rgba(0,0,0,0.2); padding: 10px 20px; border-radius: 20px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* ✨ 5초마다 나타났다 사라질 중요 팝업 */
        #importantPopup { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.9); z-index: 10000; justify-content: center; align-items: center; 
            padding: 20px; box-sizing: border-box; 
            opacity: 0; transition: opacity 0.5s ease-in-out; /* 부드러운 전환 효과 */
        }
        .important-content { background: white; width: 100%; max-width: 350px; padding: 30px 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .important-content h2 { margin: 0 0 15px 0; color: #e11d48; font-size: 1.3rem; font-weight: 900; }
        #importantPopupText { font-size: 1.1rem; line-height: 1.5; color: #1e293b; font-weight: 700; white-space: pre-wrap; word-break: keep-all; margin-bottom: 20px; }

        .notice-banner { display: none; background: #ef4444; color: white; padding: 18px; border-radius: 15px; text-align: center; font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3); animation: pulse 1.5s infinite; word-break: keep-all; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); background: #dc2626; } 100% { transform: scale(1); } }

        .card { background: white; border-radius: 20px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); }
        .notice-card { background: #eff6ff; border: 1.5px solid #dbeafe; }
        .notice-title { font-size: 0.95rem; font-weight: 800; color: #1e40af; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .notice-content { font-size: 1.05rem; line-height: 1.5; color: #1e3a8a; font-weight: 600; word-break: break-all; }
        .status-header { font-size: 0.95rem; color: #64748b; font-weight: 600; margin-bottom: 10px; display: block; text-align: center; }
        .queue-status { font-size: 2.2rem; text-align: center; font-weight: 900; color: #3b82f6; margin-bottom: 5px; }
        
        .wait-box { display: none; margin-top: 20px; background: #f8fafc; border-radius: 16px; padding: 18px 20px; text-align: center; border: 1px solid #e2e8f0; }
        .wait-time-text { font-size: 1.3rem; font-weight: 800; color: #2563eb; margin-bottom: 8px; letter-spacing: -0.5px; }
        .wait-time-text span { font-variant-numeric: tabular-nums; font-size: 1.6rem; font-weight: 900; } 
        .wait-notice { font-size: 0.8rem; color: #64748b; font-weight: 600; line-height: 1.4; word-break: keep-all; }

        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: #334155; }
        .menu-content { text-align: center; line-height: 1.8; font-size: 1.15rem; background: #f8fafc; padding: 20px; border-radius: 15px; border: 1px solid #f1f5f9; color: #334155; }
        
        .feedback-box { display: flex; flex-direction: column; gap: 12px; }
        textarea { width: 100%; height: 90px; padding: 15px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-family: inherit; resize: none; font-size: 1rem; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: #3b82f6; background: #fff; }
        button { background: #1e293b; color: white; padding: 16px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="alertOverlay" onclick="closeAlert()">
    <div class="alert-title">지금 즉시 급식실로 내려오세요!</div>
    <div id="alertGrade" class="alert-msg">O학년</div>
    <div class="alert-hint">터치하면 닫힙니다</div>
</div>

<div id="importantPopup">
    <div class="important-content">
        <h2>🚨 중요 공지사항</h2>
        <div id="importantPopupText"></div>
    </div>
</div>

<div class="container">
    <div class="header-wrap">
        <h1>무룡고등학교 실시간 급식실</h1>
        <button id="soundBtn" class="sound-btn" onclick="enableSound()">🔈 소리 켜기</button>
    </div>
    
    <div id="noticeBanner" class="notice-banner">
        <span id="targetGrade">O학년</span> 학생들은<br>지금 즉시 급식실로 내려오세요!
    </div>

    <div class="card notice-card">
        <div class="notice-title">📢 알림판</div>
        <div id="realNotice" class="notice-content">공지사항을 불러오고 있습니다...</div>
    </div>

    <div class="card">
        <span class="status-header">현재 배식 중인 학년</span>
        <div class="queue-status" id="studentQueue">데이터 연결 중...</div>
        
        <div id="subStatus" style="font-size: 0.9rem; color: #ef4444; font-weight: 700; text-align: center; margin-top: -5px; margin-bottom: 15px; display: none;">오늘은 급식 호출을 진행하지 않습니다</div>

        <div id="waitTimeBox" class="wait-box">
            <div class="wait-time-text">다음 호출 예상시간 <span id="displayTime">00:00</span></div>
            <div class="wait-notice">※ 안내된 시간은 실제 호출 시간과 다를 수 있습니다.</div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">🍚 오늘의 메뉴</div>
        <div class="menu-content" id="menuContent">급식 메뉴를 불러오고 있습니다...</div>
    </div>

    <div class="card feedback-box">
        <div class="section-title">✍️ 급식실 건의사항</div>
        <textarea id="feedbackText" placeholder="급식 메뉴나 급식실 이용에 관한 의견을 남겨주세요!"></textarea>
        <button onclick="sendFeedback()">의견 보내기</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://aaszccrhporceolrnroz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LMeSKJzTDv8L-boma9QIFA_b8iJ89e9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const grades = ["배식 전", "3학년", "2학년", "1학년", "배식 종료", "미운영"];
    let currentIdx = -1;
    let alertTimeout;
    let waitInterval = null;
    let popupInterval = null; // ✨ 팝업 반복 제어
    let isPopupVisible = false; // ✨ 팝업 상태 확인
    let currentPopupText = "";

    const dingDong = new Audio('https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3');

    function enableSound() {
        dingDong.play().then(() => {
            dingDong.pause(); 
            dingDong.currentTime = 0;
            const btn = document.getElementById('soundBtn');
            btn.innerText = "🔊 소리 켜짐";
            btn.classList.add('active');
        }).catch(e => {
            alert("소리 재생을 지원하지 않는 브라우저 설정입니다.");
        });
    }

    function showAlert(grade) {
        if (grade === "배식 종료" || grade === "배식 전" || grade === "미운영") return;
        document.getElementById('alertGrade').innerText = grade;
        document.getElementById('alertOverlay').style.display = 'flex';
        dingDong.play().catch(e => console.log("터치 전이라 소리 안남"));
        clearTimeout(alertTimeout);
        alertTimeout = setTimeout(closeAlert, 15000);
    }

    function closeAlert() { 
        document.getElementById('alertOverlay').style.display = 'none'; 
        dingDong.pause(); dingDong.currentTime = 0;
    }

    // ✨ 5초마다 팝업을 보였다 숨겼다 하는 함수
    function togglePopupDisplay() {
        const popup = document.getElementById('importantPopup');
        // 긴급 학년 호출 알림이 떠있으면 중요 팝업은 띄우지 않음
        if (document.getElementById('alertOverlay').style.display === 'flex') {
            popup.style.opacity = '0';
            setTimeout(() => { popup.style.display = 'none'; }, 500);
            isPopupVisible = false;
            return;
        }

        if (isPopupVisible) {
            // 숨기기
            popup.style.opacity = '0';
            setTimeout(() => { popup.style.display = 'none'; }, 500); // 애니메이션 시간 대기 후 숨김
            isPopupVisible = false;
        } else {
            // 보이기
            popup.style.display = 'flex';
            // 아주 약간의 딜레이 후 투명도 변경 (애니메이션 적용을 위함)
            setTimeout(() => { popup.style.opacity = '1'; }, 10);
            isPopupVisible = true;
        }
    }

    // ✨ 팝업 데이터 처리 (서버에서 데이터가 오면 실행)
    function handlePopup(text) {
        currentPopupText = text;
        const textDiv = document.getElementById('importantPopupText');
        
        if (popupInterval) clearInterval(popupInterval); // 기존 반복 중지
        
        if (text && text.trim() !== '') {
            textDiv.innerText = text;
            isPopupVisible = false; // 초기화
            togglePopupDisplay(); // 즉시 한 번 띄움
            popupInterval = setInterval(togglePopupDisplay, 5000); // 5초마다 반복 실행
        } else {
            // 팝업 내용이 없으면 완전히 숨김 및 중지
            const popup = document.getElementById('importantPopup');
            popup.style.opacity = '0';
            setTimeout(() => { popup.style.display = 'none'; }, 500);
            isPopupVisible = false;
        }
    }

    function updateWaitTimeUI(waitMin, setAtStr) {
        const waitBox = document.getElementById('waitTimeBox');
        if (waitInterval) clearInterval(waitInterval);

        if (!waitMin || waitMin <= 0 || !setAtStr) { waitBox.style.display = 'none'; return; }

        const setAt = new Date(setAtStr);
        waitInterval = setInterval(() => {
            const now = new Date();
            const diffSec = Math.floor((now - setAt) / 1000);
            const remainingSec = (waitMin * 60) - diffSec;

            if (remainingSec <= 0) {
                waitBox.style.display = 'none'; clearInterval(waitInterval);
            } else {
                waitBox.style.display = 'block';
                const m = Math.floor(remainingSec / 60); const s = remainingSec % 60;
                document.getElementById('displayTime').innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
        }, 1000);
    }

    async function loadData() {
        const { data: statusData } = await supabaseClient.from('lunch_status').select('current_index, wait_minutes, wait_set_at').eq('id', 1).single();
        if (statusData) {
            currentIdx = statusData.current_index;
            updateUI(statusData.current_index);
            updateWaitTimeUI(statusData.wait_minutes, statusData.wait_set_at);
        }
        const { data: nList } = await supabaseClient.from('announcements').select('*');
        if (nList) {
            nList.forEach(n => {
                if(n.id === 1) document.getElementById('realNotice').innerText = n.content;
                if(n.id === 2) handlePopup(n.content);
            });
        }
    }

    function updateUI(index) {
        const statusBox = document.getElementById('studentQueue');
        const subStatus = document.getElementById('subStatus');
        const banner = document.getElementById('noticeBanner');
        const targetGrade = document.getElementById('targetGrade');
        
        if (currentIdx !== -1 && currentIdx !== index && index > 0 && index < 4) { showAlert(grades[index]); }
        currentIdx = index;
        
        if (index === 5) {
            statusBox.innerText = grades[index];
            statusBox.style.color = "#ef4444"; 
            subStatus.style.display = "block";
            banner.style.display = "none";
        } else {
            subStatus.style.display = "none";
            if (index === 0 || index === 4) {
                statusBox.innerText = grades[index];
                statusBox.style.color = "#94a3b8";
                banner.style.display = "none";
            } else {
                const currentGrade = grades[index];
                statusBox.innerText = currentGrade;
                statusBox.style.color = "#3b82f6";
                banner.style.display = "block";
                targetGrade.innerText = currentGrade;
            }
        }
    }

    supabaseClient.channel('custom-all-channel').on('postgres_changes', { event: 'UPDATE', schema: 'public' }, payload => {
        if (payload.table === 'lunch_status') {
            updateUI(payload.new.current_index);
            updateWaitTimeUI(payload.new.wait_minutes, payload.new.wait_set_at);
        }
        if (payload.table === 'announcements') {
            if(payload.new.id === 1) document.getElementById('realNotice').innerText = payload.new.content;
            if(payload.new.id === 2) handlePopup(payload.new.content);
        }
    }).subscribe();

    async function sendFeedback() {
        const text = document.getElementById('feedbackText').value;
        if (!text.trim()) return;
        const { error } = await supabaseClient.from('feedback').insert([{ content: text }]);
        if (!error) { alert("소중한 의견이 전송되었습니다!"); document.getElementById('feedbackText').value = ""; }
    }

    async function fetchMenu() {
        const d = new Date().toISOString().slice(0,10).replace(/-/g, '');
        try {
            const res = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=H10&SD_SCHUL_CODE=7480070&MLSV_YMD=${d}`);
            const data = await res.json();
            if (data.mealServiceDietInfo) {
                let m = data.mealServiceDietInfo[1].row[0].DDISH_NM.replace(/[0-9.]/g, '').replace(/\(\)/g, '').replace(/<br\/>/g, '<br>');
                document.getElementById('menuContent').innerHTML = m;
            } else { document.getElementById('menuContent').innerText = "오늘은 급식 정보가 없습니다."; }
        } catch(e) { document.getElementById('menuContent').innerText = "메뉴 로드 실패"; }
    }

    loadData(); fetchMenu();
</script>
</body>
</html>
